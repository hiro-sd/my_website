<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Baseball weekly digest delivery diagram</title>
  <desc id="desc">A baseball, a weekly digest, and a phone message connected from left to right</desc>
  <defs>
