<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Baseball weekly digest delivery diagram</title>
  <desc id="desc">A baseball, a weekly digest, and a phone message connected from left to right</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151b22"/>
      <stop offset="1" stop-color="#080c11"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f8f8f4"/>
      <stop offset="1" stop-color="#dce4e7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <g id="baseball-seam" fill="none" stroke-linecap="round">
      <path d="M195 300Q279 430 195 560" stroke="#bd5048" stroke-width="5"/>
      <path d="M195 325Q206 325 219 315
               M208 352Q220 350 231 340
               M217 380Q229 378 240 368
               M222 408Q234 405 245 396
               M225 436Q237 433 248 424
               M222 464Q234 461 245 452
               M217 492Q229 489 240 480
               M208 520Q220 518 231 508
               M195 546Q206 545 219 536" stroke="#bd5048" stroke-width="8"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 144H1600M0 756H1600" stroke="#333d43" stroke-width="2" opacity=".55"/>
  <path d="M110 0V900M1490 0V900" stroke="#333d43" stroke-width="2" opacity=".35"/>

  <circle cx="275" cy="430" r="160" fill="#f4f4ed" filter="url(#shadow)"/>
  <circle cx="275" cy="430" r="153" fill="none" stroke="#dce2de" stroke-width="3"/>
  <use href="#baseball-seam"/>
  <use href="#baseball-seam" transform="translate(550 0) scale(-1 1)"/>
  <text x="275" y="665" fill="#d3d9da" font-family="Arial, sans-serif" font-size="47" font-weight="700" text-anchor="middle">NPB / MLB</text>

  <path d="M475 430h95" fill="none" stroke="#78b8bc" stroke-width="7" stroke-linecap="round"/>
  <path d="m553 410 25 20-25 20" fill="none" stroke="#78b8bc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="620" y="156" width="392" height="558" rx="22" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="655" y="191" width="322" height="12" rx="6" fill="#26363e" opacity=".22"/>
  <text x="655" y="280" fill="#17252a" font-family="Arial, sans-serif" font-size="44" font-weight="700">WEEKLY</text>
  <text x="655" y="334" fill="#17252a" font-family="Arial, sans-serif" font-size="44" font-weight="700">DIGEST</text>
