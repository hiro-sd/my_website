  <text x="1254" y="321" fill="#153e2c" font-family="Arial, sans-serif" font-size="23" font-weight="700">WEEKLY</text>
  <path d="M1254 355h146M1254 386h154M1254 417h130M1254 461h147M1254 492h110" stroke="#236348" stroke-width="12" stroke-linecap="round" opacity=".5"/>
